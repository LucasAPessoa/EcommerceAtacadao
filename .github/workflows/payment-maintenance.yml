name: Payment maintenance

# Dispara o job interno de manutenção de pagamentos (issue #24): expira reservas
# vencidas, expira pedidos abandonados e repete cancelamentos remotos falhos.
# O job roda na API; este workflow só faz a chamada autenticada.
# Secrets do repositório: MAINTENANCE_JOB_URL (URL completa do endpoint
# /api/v1/internal/jobs/payment-maintenance) e MAINTENANCE_JOB_TOKEN.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: payment-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger:
    name: Dispara manutenção de pagamentos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chama o endpoint interno
        env:
          JOB_URL: ${{ secrets.MAINTENANCE_JOB_URL }}
          JOB_TOKEN: ${{ secrets.MAINTENANCE_JOB_TOKEN }}
        run: |
          if [ -z "$JOB_URL" ] || [ -z "$JOB_TOKEN" ]; then
            echo "::notice::Secrets MAINTENANCE_JOB_URL/MAINTENANCE_JOB_TOKEN ausentes; nada a fazer."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST -H "Authorization: Bearer $JOB_TOKEN" "$JOB_URL"
