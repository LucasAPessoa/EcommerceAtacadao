name: Migration gate

# Garante a ordem: PR de migrations -> merge -> 'Migrate production' -> PR de código.
# Nunca acessa o banco de produção: compara o head do Alembic (offline) com a revisão
# registrada pelo workflow 'Migrate production' como deployment de cada
# `db_record_environment` dos clientes ativos em .github/clients.json.
on:
  pull_request:

concurrency:
  group: migration-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Migration gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # Valores fictícios exigidos por Settings; o gate não acessa banco.
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      SECRET_KEY: ci-secret-key
      REFRESH_SECRET_KEY: ci-refresh-key
      MELHOR_ENVIO_TOKEN: ci-token
      MELHOR_ENVIO_USER_AGENT: ci-agent
      STORE_ORIGIN_ZIP_CODE: "01001000"
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD é o merge commit do PR; fetch-depth 2 garante HEAD^1 (tip atual da base).
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Coleta entradas
        run: |
          git diff --name-only --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/files.txt"
          uv run alembic heads > "$RUNNER_TEMP/heads.txt"
          # Revisão por cliente ativo: último deployment `success` do db_record_environment
          # (null se não há). Registro validado antes de qualquer consulta.
          # Lista de ativos vem da BASE do PR (HEAD^1): um PR não se isenta desativando cliente
          # e o PR que ativa um cliente não trava (bootstrap ocorre após o merge).
          # Só se a base existe e ainda não tem o registro (primeira introdução), usa o do PR;
          # qualquer outra falha ao ler a base interrompe o gate.
          git rev-parse --verify --quiet HEAD^1 > /dev/null
          registry=.github/clients.json
          if git cat-file -e HEAD^1:.github/clients.json 2>/dev/null; then
            git show HEAD^1:.github/clients.json > "$RUNNER_TEMP/base-clients.json"
            registry="$RUNNER_TEMP/base-clients.json"
          fi
          python3 .github/scripts/clients.py --registry "$registry" validate
          python3 .github/scripts/clients.py --registry "$registry" matrix --client all > "$RUNNER_TEMP/matrix.json"
          echo '{}' > "$RUNNER_TEMP/deployed.json"
          while IFS=$'\t' read -r cid renv; do
            deployed=""
            for id in $(gh api "repos/$REPO/deployments?environment=$renv&per_page=30" --jq '.[].id'); do
              state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
              if [ "$state" = "success" ]; then
                deployed=$(gh api "repos/$REPO/deployments/$id" --jq '.payload.revision // ""')
                break
              fi
            done
            if [ -n "$deployed" ] && ! [[ "$deployed" =~ ^[0-9a-f]+$ ]]; then
              echo "::error title=Migration gate::Revisão inválida no deployment $renv ($cid)." >&2
              exit 1
            fi
            jq --arg c "$cid" --arg r "$deployed" '. + {($c): (if $r == "" then null else $r end)}' \
              "$RUNNER_TEMP/deployed.json" > "$RUNNER_TEMP/deployed.tmp"
            mv "$RUNNER_TEMP/deployed.tmp" "$RUNNER_TEMP/deployed.json"
          done < <(jq -r '.include[] | [.id, .db_record_environment] | @tsv' "$RUNNER_TEMP/matrix.json")
      - name: Decide
        run: python3 .github/scripts/migration_gate.py --files "$RUNNER_TEMP/files.txt" --heads "$RUNNER_TEMP/heads.txt" --deployed-json "$RUNNER_TEMP/deployed.json"
